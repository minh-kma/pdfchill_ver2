<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Icons, theme colour and the manifest link. These are the only <head> tags authored by hand,
      because they are the only ones identical on every page in every language — nothing here
      varies by route, so none of it belongs in pageMeta.ts. Everything that *does* vary (title,
      description, canonical, hreflang, Open Graph, robots) is computed there and written in by
      scripts/prerender.mjs and useDocumentMeta.ts. Do not add a per-page tag to this file.

      The files themselves are generated from images/logo.png; see public/README.md. favicon.ico
      is listed first and carries 16/32/48 for the browsers that ignore the PNG links and for the
      bare /favicon.ico request every browser makes anyway.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      The page background, so the mobile browser chrome blends into the page rather than
      butting a white bar against a cream one. Tracks --color-canvas in src/index.css and
      the manifest colours in scripts/prerender.mjs; all three change together.
    -->
    <meta name="theme-color" content="#f5ece7" />

    <!--
      Single SPA entry point, and the template scripts/prerender.mjs rewrites per route.

      The per-page SEO tags (page title, description, html lang, canonical, hreflang) are computed
      in exactly one place — buildPageMeta() in shared/seo/pageMeta.ts — and applied twice: by
      shared/seo/useDocumentMeta.ts at runtime, and by scripts/prerender.mjs at build time. The old
      app authored that copy twice by hand (static head + seo.json) and the two drifted, which
      shipped a production bug — SPEC.md §7 pain point #2. Do not hand-write per-page title or
      description here or in the build script.

      The tags below are placeholders for the dev server only; every file in dist/ gets real ones.
      Note the prerenderer strips these comments from its output, partly because a comment naming
      those tags literally would collide with its own tag rewriting.
    -->
    <title>PDFChill</title>
    <meta name="description" content="Free browser-based PDF tools." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
