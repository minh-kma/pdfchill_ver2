<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Single SPA entry point, and the template scripts/prerender.mjs rewrites per route.

      The per-page SEO tags (page title, description, html lang, canonical, hreflang) are computed
      in exactly one place — buildPageMeta() in shared/seo/pageMeta.ts — and applied twice: by
      shared/seo/useDocumentMeta.ts at runtime, and by scripts/prerender.mjs at build time. The old
      app authored that copy twice by hand (static head + seo.json) and the two drifted, which
      shipped a production bug — SPEC.md §7 pain point #2. Do not hand-write per-page title or
      description here or in the build script.

      The tags below are placeholders for the dev server only; every file in dist/ gets real ones.
      Note the prerenderer strips these comments from its output, partly because a comment naming
      those tags literally would collide with its own tag rewriting.
    -->
    <title>PDFChill</title>
    <meta name="description" content="Free browser-based PDF tools." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
